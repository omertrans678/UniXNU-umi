# GPU addon build on a GitHub-hosted Mac (Xcode = iPhoneOS SDK, xcrun, codesign).
#
# Put this file in YOUR FORK of https://github.com/UniXNU/UniXNU as .github/workflows/gpu-addon.yml, then
# Actions -> "GPU addon (umi)" -> Run workflow. It builds Turnip (Mesa freedreno, Darwin kernel backend), the
# NativeAdrenoMetal plugin (metal2vulkan Rust bridge) and adrenoprobed exactly as docs/porting/gpu.md "Build and stage
# Metal" describes (scripts/build-boot-runtime.py build_plugin + make-gpu-addon.py), and uploads:
#   gpuaddon.bin            the NGPUADD2 addon the umi kernel embeds (umi-work/out/umi/gpu-addon.bin)
#   gpuaddon-cdhashes.txt   CDHashes of its executables, for the owner trust module
#   manifests/              plugin/bridge/Turnip identity files
# Only owner-built binaries are uploaded: no SDK, IPSW member or Apple binary. Import locally with
#   python3 tools/import_gpu_addon.py <downloaded artifact dir>
name: GPU addon (umi)

on:
  workflow_dispatch:
    inputs:
      target:
        description: OS target of the plugin build (umi runs iPadOS 17.7.11 -> ios)
        type: choice
        options: [ios, ios27]
        default: ios
      xcode:
        description: Xcode version on the macos-26 image (/Applications/Xcode_<version>.app)
        required: true
        default: "26.6"
      publish:
        description: Add addons/NativeAdrenoMetal.publish (the render server takes the Adreno device)
        type: boolean
        default: true
      abi_header_url:
        description: Optional raw URL of a NativeAdrenoABI.h to build against (e.g. the umi kernel driver's); empty keeps drivers/Adreno740's
        required: false
        default: ""
      prime_list_url:
        description: Optional raw URL of a priming list (absolute .metallib paths, one per line)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: gpu-addon-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    # Same pinned image and Xcode line as the upstream macOS build (macos.yml).
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the GPU components
        run: |
          # Only what the Turnip / plugin / addon builds read.
          git submodule update --init --depth 1 drivers/Adreno740 drivers/AdrenoMetal kits/AdrenoPM4 kits/AdrenoFirmware kits/AirNir
          git -C drivers/Adreno740 rev-parse HEAD
          git -C drivers/AdrenoMetal rev-parse HEAD

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          # llvm: llvm-as for the bridge fixtures (LLVM 21+), llvm-objcopy; glslang/shaderc/spirv-tools: Vulkan runtime and smoke
          # shaders (glslangValidator, glslc, spirv-val); bison >= 3.7 for the IR3 parser. meson comes from the pinned venv.
          brew install llvm lld glslang shaderc spirv-tools bison ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          # The Metal bridge pins Rust 1.98.0 (scripts/build-adreno-metal-bridge.py).
          rustup toolchain install 1.98.0 --profile minimal --component rust-src --target aarch64-apple-ios

      - name: Report the toolchain
        run: |
          sw_vers; uname -m; xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          llvm-as --version | head -n 2
          glslangValidator --version | head -n 1
          glslc --version | head -n 1
          bison --version | head -n 1
          cargo +1.98.0 --version
          df -h "$GITHUB_WORKSPACE"

      - name: Optional ABI header override
        run: |
          url=$(jq -r '.inputs.abi_header_url // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$url" ]; then
            echo "::add-mask::$url"
            curl -fsSL --retry 3 "$url" -o drivers/Adreno740/NativeAdrenoABI.h
            echo "Building against the supplied NativeAdrenoABI.h:"
            grep -n "NativeAdrenoAbiVersion\|NativeAdrenoAbiMaxBuffers\|NativeAdrenoMethod" drivers/Adreno740/NativeAdrenoABI.h
          fi

      - name: Build Turnip and the Metal plugin
        run: |
          # build_plugin(): pinned Mesa + recorded patches, pinned metal2vulkan, the compiler venv, build-turnip-darwin.py,
          # build-adreno-metal-plugin.py --no-replay --reuse-bridge.
          python3 - <<'PY'
          import importlib.util, os, sys
          sys.path.insert(0, 'scripts')
          spec = importlib.util.spec_from_file_location('build_boot_runtime', 'scripts/build-boot-runtime.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print('plugin:', module.build_plugin(os.environ['TARGET']), flush=True)
          PY

      - name: Pack the GPU addon
        run: |
          plugin_dir=build/adreno-metal-plugin
          [ "$TARGET" = ios27 ] && plugin_dir=build/adreno-metal-plugin27
          args=()
          [ "${{ inputs.publish }}" = true ] && args+=(--publish)
          url=$(jq -r '.inputs.prime_list_url // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$url" ]; then
            curl -fsSL --retry 3 "$url" -o build/prime-list.txt
            args+=(--prime-list build/prime-list.txt)
          fi
          ADRENO_PLUGIN_DIR="$plugin_dir" python3 scripts/make-gpu-addon.py "${args[@]}" build/gpuaddon.bin
          ls -l build/gpuaddon.bin

      - name: Record the executables' CDHashes
        run: |
          mkdir -p out/manifests
          python3 - <<'PY'
          import importlib.util, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          spec = importlib.util.spec_from_file_location('build_boot_runtime', 'scripts/build-boot-runtime.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as work:
              hashes = module.addon_hashes(Path('build/gpuaddon.bin'), Path(work))
          Path('out/gpuaddon-cdhashes.txt').write_text('\n'.join(hashes) + '\n')
          print('\n'.join(hashes))
          PY
          cp build/gpuaddon.bin out/
          plugin_dir=build/adreno-metal-plugin
          [ "$TARGET" = ios27 ] && plugin_dir=build/adreno-metal-plugin27
          find "$plugin_dir" build/adreno-metal-bridge -maxdepth 2 -name '*.json' -exec cp {} out/manifests/ \; || true
          (cd out && shasum -a 256 gpuaddon.bin gpuaddon-cdhashes.txt > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Upload the GPU addon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-addon-${{ inputs.target }}-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: error
