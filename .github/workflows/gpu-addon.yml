# GPU addon build on a GitHub-hosted Mac (Xcode = iPhoneOS SDK, xcrun, codesign).
#
# Put this file in the UniXNU-umi fork (or any repository) as .github/workflows/gpu-addon.yml, then
# Actions -> "GPU addon (umi)" -> Run workflow. It checks out the public https://github.com/UniXNU/UniXNU into unixnu/
# (this repository goes to umi/, for its ABI header) and builds Turnip (Mesa freedreno, Darwin kernel backend), the
# NativeAdrenoMetal plugin (metal2vulkan Rust bridge) and adrenoprobed exactly as docs/porting/gpu.md "Build and stage
# Metal" describes (scripts/build-boot-runtime.py build_plugin + make-gpu-addon.py), and uploads:
#   gpuaddon.bin            the NGPUADD2 addon the umi kernel embeds (umi-work/out/umi/gpu-addon.bin)
#   gpuaddon-cdhashes.txt   CDHashes of its executables, for the owner trust module
#   manifests/              plugin/bridge/Turnip identity files
# Only owner-built binaries are uploaded: no SDK, IPSW member or Apple binary. Import locally with
#   python3 tools/import_gpu_addon.py <downloaded artifact dir>
name: GPU addon (umi)

on:
  workflow_dispatch:
    inputs:
      target:
        description: OS target of the plugin build (umi runs iPadOS 17.7.11 -> ios)
        type: choice
        options: [ios, ios27]
        default: ios
      runner:
        description: Hosted macOS image (macos-26 arm64 can queue for long under capacity limits; try another one then)
        type: choice
        options: [macos-26, macos-15, macos-latest, macos-15-intel]
        default: macos-26
      xcode:
        description: Preferred Xcode (/Applications/Xcode_<version>.app); if missing, the newest installed Xcode 26 is used
        required: true
        default: "26.6"
      publish:
        description: Add addons/NativeAdrenoMetal.publish (the render server takes the Adreno device)
        type: boolean
        default: true
      unixnu_ref:
        description: UniXNU/UniXNU ref (branch, tag or commit) to build from
        required: true
        default: main
      abi_source:
        description: NativeAdrenoABI.h to build against - upstream (drivers/Adreno740) or umi (package/umi-adreno/Adreno650 of this repository)
        type: choice
        options: [upstream, umi]
        default: upstream
      prime_list_url:
        description: Optional raw URL of a priming list (absolute .metallib paths, one per line)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: gpu-addon-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    # Upstream's macOS build pins macos-26 with the Xcode 26 line; the input allows another hosted image when that one is
    # out of capacity ("job was not acquired by Runner of type hosted").
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      TARGET: ${{ inputs.target }}
    defaults:
      run:
        shell: bash
        working-directory: unixnu
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          path: unixnu
          persist-credentials: false

      - name: Check out this repository (umi ABI header)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: umi
          persist-credentials: false

      - name: Select Xcode
        env:
          WANTED: ${{ inputs.xcode }}
        run: |
          echo "Installed: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
          app="/Applications/Xcode_${WANTED}.app"
          if [ ! -d "$app" ]; then
            # Newest Xcode 26.x on this image (the build uses the Xcode 26 clang; older ones reject its -Werror warning set).
            app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          [ -n "$app" ] && [ -d "$app" ] || { echo "::error::no Xcode 26 on this image; pick another runner"; exit 1; }
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $app"

      - name: Check out the GPU components
        run: |
          # Only what the Turnip / plugin / addon builds read.
          git submodule update --init --depth 1 drivers/Adreno740 drivers/AdrenoMetal kits/AdrenoPM4 kits/AdrenoFirmware kits/AirNir
          git -C drivers/Adreno740 rev-parse HEAD
          git -C drivers/AdrenoMetal rev-parse HEAD

      - name: Patch the translator for iOS (umi)
        run: |
          # metal2vulkan 46e7cc96 defines copied.rs read_pages (mach_vm_read_overwrite of the own task) for macOS, Linux and
          # Windows only, so the runtime fails on aarch64-apple-ios (E0425 read_pages). The macOS body is the same Mach call on
          # iOS: widen its cfg. Recorded as one more bridge patch, so the bridge script's pin + patch checks still hold.
          patch=drivers/AdrenoMetal/bridge/patches/0099-umi-ios-read-pages.patch
          cat > "$patch" <<'EOF'
          diff --git a/crates/metal2vulkan-runtime/src/copied.rs b/crates/metal2vulkan-runtime/src/copied.rs
          --- a/crates/metal2vulkan-runtime/src/copied.rs
          +++ b/crates/metal2vulkan-runtime/src/copied.rs
          @@ -2643,3 +2643,3 @@
           /// [`read_pages`] on macOS.
          -#[cfg(target_os = "macos")]
          +#[cfg(any(target_os = "macos", target_os = "ios"))]
           pub(crate) fn read_pages(pages: NonNull<u8>, into: &mut [u8]) -> bool {
          EOF
          python3 - <<'PY'
          from pathlib import Path
          script = Path('scripts/build-adreno-metal-bridge.py')
          text = script.read_text()
          anchor = "for name in ["
          if '0099-umi-ios-read-pages.patch' not in text:
              head, sep, rest = text.partition(anchor)
              body, close, tail = rest.partition(']]')
              assert sep and close, 'PATCHES list not found in build-adreno-metal-bridge.py'
              script.write_text(head + sep + body.rstrip() + ",\n    '0099-umi-ios-read-pages.patch'" + close + tail)
          PY
          grep -n -A4 "^PATCHES" scripts/build-adreno-metal-bridge.py

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          # llvm: llvm-as for the bridge fixtures (LLVM 21+), llvm-objcopy; glslang/shaderc/spirv-tools: Vulkan runtime and smoke
          # shaders (glslangValidator, glslc, spirv-val); bison >= 3.7 for the IR3 parser. meson comes from the pinned venv.
          brew install llvm lld glslang shaderc spirv-tools bison ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          # The Metal bridge pins Rust 1.98.0 (scripts/build-adreno-metal-bridge.py).
          rustup toolchain install 1.98.0 --profile minimal --component rust-src --target aarch64-apple-ios

      - name: Report the toolchain
        run: |
          sw_vers; uname -m; xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          llvm-as --version | head -n 2
          glslangValidator --version | head -n 1
          glslc --version | head -n 1
          bison --version | head -n 1
          cargo +1.98.0 --version
          df -h "$GITHUB_WORKSPACE"

      - name: ABI header
        run: |
          if [ "${{ inputs.abi_source }}" = umi ]; then
            cp ../umi/package/umi-adreno/Adreno650/NativeAdrenoABI.h drivers/Adreno740/NativeAdrenoABI.h
            echo "Building against the umi kernel driver's NativeAdrenoABI.h"
          fi
          grep -n "NativeAdrenoAbiVersion\|NativeAdrenoAbiMaxBuffers\|NativeAdrenoMethod" drivers/Adreno740/NativeAdrenoABI.h

      - name: Build Turnip and the Metal plugin
        run: |
          # build_plugin(): pinned Mesa + recorded patches, pinned metal2vulkan, the compiler venv, build-turnip-darwin.py,
          # build-adreno-metal-plugin.py --no-replay --reuse-bridge.
          python3 - <<'PY'
          import importlib.util, os, sys
          sys.path.insert(0, 'scripts')
          spec = importlib.util.spec_from_file_location('build_boot_runtime', 'scripts/build-boot-runtime.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print('plugin:', module.build_plugin(os.environ['TARGET']), flush=True)
          PY

      - name: Pack the GPU addon
        run: |
          plugin_dir=build/adreno-metal-plugin
          [ "$TARGET" = ios27 ] && plugin_dir=build/adreno-metal-plugin27
          args=()
          [ "${{ inputs.publish }}" = true ] && args+=(--publish)
          url=$(jq -r '.inputs.prime_list_url // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$url" ]; then
            curl -fsSL --retry 3 "$url" -o build/prime-list.txt
            args+=(--prime-list build/prime-list.txt)
          fi
          ADRENO_PLUGIN_DIR="$plugin_dir" python3 scripts/make-gpu-addon.py "${args[@]}" build/gpuaddon.bin
          ls -l build/gpuaddon.bin

      - name: Record the executables' CDHashes
        run: |
          mkdir -p out/manifests
          python3 - <<'PY'
          import importlib.util, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          spec = importlib.util.spec_from_file_location('build_boot_runtime', 'scripts/build-boot-runtime.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as work:
              hashes = module.addon_hashes(Path('build/gpuaddon.bin'), Path(work))
          Path('out/gpuaddon-cdhashes.txt').write_text('\n'.join(hashes) + '\n')
          print('\n'.join(hashes))
          PY
          cp build/gpuaddon.bin out/
          plugin_dir=build/adreno-metal-plugin
          [ "$TARGET" = ios27 ] && plugin_dir=build/adreno-metal-plugin27
          find "$plugin_dir" build/adreno-metal-bridge -maxdepth 2 -name '*.json' -exec cp {} out/manifests/ \; || true
          (cd out && shasum -a 256 gpuaddon.bin gpuaddon-cdhashes.txt > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Upload the GPU addon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-addon-${{ inputs.target }}-${{ github.run_number }}
          path: unixnu/out/
          retention-days: 7
          if-no-files-found: error
