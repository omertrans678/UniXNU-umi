version = 1

[boot]
timeout = 0
fallback_timeout = 3600
default = "xnu"
rotate = 0
connect_all = true

[ui]
title = "Mi 10 - prelinked XNU diagnostics"

[kits]
autoload = false

[[entry]]
id = "xnu"
title = "Boot XNU root storage"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v keepsyms=1 kt_fixed_zones=120 umi-pmgr=2 umi-ufs-probe=2 sheng-data-persist=2 sheng-log-reserve=1024 umi-user-log=1 sheng-smp=1 armcpu-self-ipi=1 armcpu-spi-ipi=0 boot-progress=2 boot-diag-resume=0 boot-diag-overlay=1 sheng-disable-watchdogd=1 sheng-disable-jobs=~identityservicesd,~locationd,~CommCenter,~bluetoothd,~MSUEarlyBootTask,~mobile.softwareupdated,~init_featureflags,init_featureflags,~logd offline-key-events=1 sheng-aks=1 native-ufs-root=1 offline-apfs-load=1 -apfs_shared_datavolume offline-legacy-register=1 offline-legacy-gop=1 offline-legacy-unit-scale=2 offline-legacy-pm=1 offline-legacy-validate=1 offline-legacy-transfer=1 offline-legacy-cpu-present=1 offline-legacy-phase=4 offline-mobile-graphics-load=1 umi-fts=1 offline-hid-input=1 offline-hid-home=1 sheng-touch-hid=1 umi-fts-gpi=1 umi-gp=2 umi-ar=150 sheng-gpu-addon=1 fb-gpu=1 umi-skipd=0 umi-skip-setup=1 dpu-scanout=2 umi-cpufreq=4 umi-build-tag=umi-192"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"
